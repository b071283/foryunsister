<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>暫停服務維護中</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .maintenance {
      max-width: 480px;
      margin: 80px auto 0;
      padding: 36px 28px 32px;
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .maintenance-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .maintenance h1 {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: 22px;
      letter-spacing: 2px;
    }
    .maintenance p {
      margin: 8px 0;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.7;
    }
    .maintenance-sign {
      margin-top: 28px;
      color: var(--primary);
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <div class="bg-deco">
    <span class="bg-blob bg-blob-1"></span>
    <span class="bg-blob bg-blob-2"></span>
    <span class="bg-spark bg-spark-1">✦</span>
    <span class="bg-spark bg-spark-2">✦</span>
  </div>

  <main class="maintenance">
    <div class="maintenance-icon">🌸</div>
    <h1>服務暫停維護中</h1>
    <p>系統正在更新與優化</p>
    <p>請稍候片刻再回來</p>
    <p class="maintenance-sign">— 勻勻 ♡</p>
  </main>
</body>
</html>
